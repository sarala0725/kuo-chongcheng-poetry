<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-labelledby="title">
  <title id="title">郭崇城印章</title>
  <defs>
    <filter id="worn" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="ink">
      <rect width="112" height="112" fill="white"/>
      <g fill="#000" opacity=".4">
        <circle cx="16" cy="21" r="1.1"/><circle cx="30" cy="11" r=".8"/>
        <circle cx="91" cy="15" r="1"/><circle cx="104" cy="35" r="1.4"/>
        <circle cx="10" cy="62" r="1"/><circle cx="22" cy="97" r="1.3"/>
        <circle cx="74" cy="101" r=".8"/><circle cx="100" cy="86" r="1.1"/>
      </g>
    </mask>
  </defs>
  <path d="M54 8 C79 5 99 19 104 46 C109 76 92 100 61 105 C33 109 10 94 8 65 C6 37 24 12 54 8 Z" fill="#9f3f32" filter="url(#worn)" mask="url(#ink)"/>
